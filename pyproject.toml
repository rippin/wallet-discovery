[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wallet-observatory"
version = "0.1.0"
description = "Solana wallet discovery, prospective research, and paper-trading dashboard"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Wallet Observatory contributors"}]
dependencies = []

[project.scripts]
wallet-observatory = "wallet_observatory.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["wallet_observatory*"]

[tool.setuptools.package-data]
wallet_observatory = ["instructions.json", "static/*.html", "static/*.css", "static/*.js"]
