services:
  observatory:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      OBS_HOST: 0.0.0.0
      OBS_DB: /data/observatory.sqlite3
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - observatory-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
volumes:
  observatory-data:
